[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railcad"
version = "0.1.0"
description = "Desktop engineering MVP for railway track geometry design and validation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI Codex"}]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
full = [
  "PySide6>=6.7",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "ezdxf>=1.3",
  "pyqtgraph>=0.13",
]
dev = [
  "pytest>=8.1",
]

[project.scripts]
railcad-cli = "railcad.cli:main"
railcad-ui = "railcad.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
